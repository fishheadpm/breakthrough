<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakthrough①</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<div class="container">

<h1>Breakthrough①</h1>

<div id="menuScreen">
<button onclick="start()">最初から</button>
<button onclick="continueGame()">続きから</button>
<button onclick="showHistory()">履歴</button>
<button onclick="resetHistory()">履歴リセット</button>
</div>

<div id="quizScreen" class="hidden">
<p id="progress"></p>
<h2 id="question"></h2>

<button onclick="showAnswer()">答え表示</button>

<div id="answerArea" class="hidden">
<p id="answer"></p>

<button onclick="correct()">正解</button>
<button onclick="wrong()">間違い</button>
</div>
</div>

</div>

<script src="app.js?v=1"></script>
</body>
</html>
